[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chrome-instance"
version = "0.1.0"
description = "Run separate Google Chrome instances as their own desktop apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "materialyoucolor>=3",
    "pillow",
]

[project.scripts]
chrome-instance = "chrome_instance:main"

[tool.setuptools]
py-modules = ["chrome_instance"]
